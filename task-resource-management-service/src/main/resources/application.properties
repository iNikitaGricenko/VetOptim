# Task & Resource Management Service Configuration
server.port=8082

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/task_resource_db
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Kafka Connection Settings
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Kafka Topic Configuration
kafka.topic.task.created=task-created
kafka.topic.task.completed=task-completed
kafka.topic.resource.depleted=resource-depleted
kafka.consumer.group.resource.depleted=resource-depleted-group

# Kafka Notification Configuration
kafka.topic.notification.urgent=notification-urgent
kafka.topic.notification.resource.depletion=notification-resource-depletion
kafka.consumer.group.notification=notification-group

# Spring Scheduler Configuration
spring.task.scheduling.pool.size=10

# Feign client configuration
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.client.config.default.retryer.period=100
feign.client.config.default.retryer.maxPeriod=1000
feign.client.config.default.retryer.maxAttempts=3

billing.service.url=localhost:8085
pet-management.service.url=localhost:8083
